[workspace]
members = [
    "programs/solana-vault-escrow",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "=1.2.0"
anchor-api = "=1.2.0"
litesvm = "=0.10.0"
solana-account = "3.0.0"
solana-clock = "3.0.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-signer = "3.0.0"
spl-token-interface = "2.0.0"